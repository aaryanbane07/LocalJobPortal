{% extends "base.html" %}
{% block title %}Admin Console Login - Local Job Portal{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge" style="background: #f1f5f9; color: var(--text-main);">
        <i class="ri-shield-keyhole-fill"></i>
      </div>
      <h1 class="auth-title">Admin Portal</h1>
      <p class="auth-subtitle">Sign in with administrator privileges to manage platform data</p>
    </div>

    <form method="POST" id="adminLoginForm" novalidate>
      <div class="form-group">
        <label for="username">Admin Username *</label>
        <input type="text" name="username" id="username" placeholder="admin" required autocomplete="username">
        <span class="error-msg" id="usernameError"></span>
      </div>

      <div class="form-group">
        <label for="password">Admin Password *</label>
        <input type="password" name="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-lg full-width" style="margin-top: 10px;">
        <i class="ri-lock-unlock-line"></i> Access Admin Console
      </button>
    </form>

    <div class="auth-footer" style="background: var(--bg-main); padding: 12px; border-radius: var(--radius-sm); border: 1px dashed var(--border); margin-top: 24px;">
      <p style="font-size: 0.8125rem; color: var(--text-muted); margin: 0;">
        <i class="ri-information-line"></i> Default Credentials: <code>admin</code> / <code>admin123</code>
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', function(e){
  if(!validateAdminLoginForm()) e.preventDefault();
});
</script>
{% endblock %}
