{% extends "base.html" %}
{% block title %}Page Not Found (404) - Local Job Portal{% endblock %}

{% block content %}
<section class="section" style="text-align: center; padding: 100px 20px;">
  <div class="glass-card" style="max-width: 560px; margin: 0 auto; padding: 60px 30px;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--error-light); color: var(--error); display: inline-flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 24px;">
      <i class="ri-compass-discover-line"></i>
    </div>
    <h1 style="font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: var(--text-main); margin-bottom: 12px;">404</h1>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main);">Page Not Found</h2>
    <p style="font-size: 1rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px;">
      The page you're trying to reach doesn't exist, has been removed, or is temporarily unavailable.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('index') }}" class="btn btn-primary">
        <i class="ri-home-line"></i> Back to Home
      </a>
      <a href="{{ url_for('jobs') }}" class="btn btn-outline">
        <i class="ri-search-line"></i> Explore Jobs
      </a>
    </div>
  </div>
</section>
{% endblock %}
